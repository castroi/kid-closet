# Regenerates package-lock.json when package.json changes on a branch, for
# when `npm install` can't be run locally. Runs by itself on every push to a
# branch other than main that touches package.json (or this file); can also be
# started from the Actions tab. It commits to that branch and then starts CI
# for the new commit. Its own commit only changes package-lock.json, so it
# does not start itself again.
name: Update lockfile

on:
  push:
    branches-ignore: [main]
    paths:
      - package.json
      - .github/workflows/update-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write # commit the lockfile
  actions: write # start CI for that commit (pushes by this workflow don't trigger it)

concurrency: lockfile-${{ github.ref }}

jobs:
  lockfile:
    # main only changes through pull requests.
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Pinned to exact commits because this job can write to the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave a write token in .git/config for the npm step; only the push below gets it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Resolves versions only; no package code runs (.npmrc also sets ignore-scripts).
      # The new lockfile lands on the PR branch, so it is part of the PR the owner reviews.
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit the lockfile if it changed
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package-lock.json"
          # The token goes in a header for this one command only, never into the URL or .git/config.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Run CI on the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
