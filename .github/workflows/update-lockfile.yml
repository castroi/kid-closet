# Keeps a branch's version and lockfile right, so nobody has to remember either.
# On every push to a branch other than main it:
#   1. sets the version the branch type needs against main as it is now
#      (feat/ → next minor, fix/ → next patch, chore/docs/test → main's;
#      a version that's already right, e.g. a deliberate next major, is kept).
#      Only once the branch contains main: bumping past a main it hasn't merged
#      would make the version lines conflict, so until then it waits for
#      "Update branch" (merging main), which is itself a push and runs this again,
#   2. regenerates package-lock.json when it doesn't list package.json's
#      dependencies (for when `npm install` can't run locally),
#   3. commits both to that branch if anything changed, and starts CI for the new commit.
# It never touches main: the commit lands on the PR branch, where the owner reviews it.
# Its own commit doesn't start it again (pushes made with the workflow token never do).
# If it committed, pull before you push again. Can also be started from the Actions tab.
name: Update version and lockfile

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write # commit the version and the lockfile
  actions: write # start CI for that commit (pushes by this workflow don't trigger it)

concurrency: lockfile-${{ github.ref }}

jobs:
  lockfile:
    # main only changes through pull requests.
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Pinned to exact commits because this job can write to the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave a write token in .git/config for the npm step; only the push below gets it.
          persist-credentials: false
          # Full history, so the script can tell whether the branch already contains main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Main as it is right now (the repository is public, so no token is needed to read it).
      - name: Fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      # Same rules as CI's check (scripts/version-check.mjs). The branch name reaches the script
      # through an environment variable, never pasted into the shell command.
      - name: Set the version
        env:
          BRANCH: ${{ github.ref_name }}
        run: node scripts/version-check.mjs --bump --branch "$BRANCH" --base-ref origin/main
      # Only when the lockfile doesn't already list package.json's dependencies, so a push that
      # changed none can't pick up lockfile churn from a different npm. Resolves versions only;
      # no package code runs (.npmrc also sets ignore-scripts).
      - name: Update package-lock.json
        run: |
          if node scripts/version-check.mjs --lock-in-sync; then exit 0; fi
          npm install --package-lock-only --ignore-scripts
      - name: Commit if anything changed
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- package.json package-lock.json)" ]; then
            echo "Version and package-lock.json are already right"
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$(git diff --name-only -- package.json)" ]; then
            MESSAGE="Set version to ${VERSION}"
          else
            MESSAGE="Update package-lock.json"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "${MESSAGE}" -m "Made by the \"Update version and lockfile\" workflow against main at $(git rev-parse --short origin/main)."
          # The token goes in a header for this one command only, never into the URL or .git/config.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Run CI on the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
