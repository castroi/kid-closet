# Regenerates package-lock.json after a dependency change in package.json, for
# when `npm install` can't be run locally. Run it from the Actions tab
# ("Update lockfile" → Run workflow → choose your branch, never main). It
# commits to that branch and then starts CI for the new commit.
name: Update lockfile

on:
  workflow_dispatch:

permissions:
  contents: write # commit the lockfile
  actions: write # start CI for that commit (pushes by this workflow don't trigger it)

concurrency: lockfile-${{ github.ref }}

jobs:
  lockfile:
    # main only changes through pull requests.
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Pinned to exact commits because this job can write to the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - name: Commit the lockfile if it changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package-lock.json"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Run CI on the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
