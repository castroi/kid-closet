name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # started by "Update version and lockfile" after it commits

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to exact commits, so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits deep, so on main the version check can compare a merge with the commit before it.
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Installs exactly what package-lock.json lists; no install scripts run (.npmrc).
      - name: Install
        run: npm ci --no-audit --no-fund

      # feat/ → next minor, fix/ → next patch, chore/docs/test → unchanged or next patch (scripts/version-check.mjs).
      # Runs on every branch run, including the one "Update version and lockfile" starts after its commit, and always against
      # main as it is now (fetched here), not the main a re-run's merge commit was made from.
      # The branch name comes from the PR, so it's passed through an environment variable, never pasted into the script.
      - name: Version bump
        if: github.ref != 'refs/heads/main'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          node scripts/version-check.mjs --branch "$BRANCH" --base-ref origin/main

      # On main, after a merge: the merged branch's bump must still be right against the main it landed on.
      # Fails if two open PRs took the same version and were both merged.
      - name: Version went up on main
        if: github.ref == 'refs/heads/main'
        run: node scripts/version-check.mjs --merge-commit HEAD

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Real browsers (playwright.config.ts), next to "check" so it doesn't wait for it.
  # PRs: WebKit only, on the smallest and largest iPhone, because her phone is Safari.
  # main: also Chromium for the offline (service worker) test.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Browsers are tied to the Playwright version, so the cache is too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ github.ref == 'refs/heads/main' && 'all' || 'webkit' }}

      # Skips the download when cached; the system libraries are installed every time.
      - name: Install browsers
        env:
          BROWSERS: ${{ github.ref == 'refs/heads/main' && 'webkit chromium' || 'webkit' }}
        run: npx playwright install --with-deps $BROWSERS

      - name: Build
        run: npm run build

      - name: E2E tests
        env:
          PROJECTS: ${{ github.ref == 'refs/heads/main' && '' || '--project=iphone-se --project=iphone-pro-max' }}
        run: npx playwright test $PROJECTS

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
